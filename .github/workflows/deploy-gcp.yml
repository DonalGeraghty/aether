name: Deploy Aether to Cloud Run

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: aether-cloud-run-production
  cancel-in-progress: true

permissions:
  contents: read

env:
  PROJECT_ID: donal-geraghty-home
  REGION: europe-west1
  SERVICE_NAME: aether
  REPOSITORY: aether
  JANUS_API_URL: ${{ vars.VITE_JANUS_API_URL || 'https://janus-api-schep5xsoq-ew.a.run.app' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.19.1'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        env:
          VITE_JANUS_API_URL: ${{ env.JANUS_API_URL }}
        run: npm run build

      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          project_id: ${{ env.PROJECT_ID }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Verify Google Cloud target
        run: |
          gcloud config set project "${PROJECT_ID}"
          gcloud auth list --filter=status:ACTIVE --format='value(account)'
          gcloud config get-value project

      - name: Ensure Artifact Registry repository exists
        run: |
          if ! gcloud artifacts repositories describe "${REPOSITORY}" --location="${REGION}" >/dev/null 2>&1; then
            gcloud artifacts repositories create "${REPOSITORY}" \
              --repository-format=docker \
              --location="${REGION}" \
              --description="Aether frontend container images"
          fi

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build container image
        env:
          IMAGE: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}
        run: |
          docker build \
            --build-arg "VITE_JANUS_API_URL=${JANUS_API_URL}" \
            --tag "${IMAGE}:${GITHUB_SHA}" \
            --tag "${IMAGE}:latest" \
            .

      - name: Push container image
        env:
          IMAGE: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}
        run: |
          docker push "${IMAGE}:${GITHUB_SHA}"
          docker push "${IMAGE}:latest"

      - name: Deploy to Cloud Run
        env:
          IMAGE: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}
        run: |
          gcloud run deploy "${SERVICE_NAME}" \
            --image "${IMAGE}:${GITHUB_SHA}" \
            --project "${PROJECT_ID}" \
            --region "${REGION}" \
            --platform managed \
            --allow-unauthenticated \
            --port 8080 \
            --memory 256Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 3 \
            --quiet

      - name: Read deployed service URL
        id: service
        run: |
          url="$(gcloud run services describe "${SERVICE_NAME}" \
            --project "${PROJECT_ID}" \
            --region "${REGION}" \
            --format='value(status.url)')"
          echo "url=${url}" >> "${GITHUB_OUTPUT}"

      - name: Smoke test deployment
        run: curl --fail --show-error --silent --retry 5 --retry-delay 5 "${{ steps.service.outputs.url }}/health"

      - name: Publish deployment summary
        run: |
          echo "## Aether deployed" >> "${GITHUB_STEP_SUMMARY}"
          echo "" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Service: \`${SERVICE_NAME}\`" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Region: \`${REGION}\`" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Revision image: \`${GITHUB_SHA}\`" >> "${GITHUB_STEP_SUMMARY}"
          echo "- URL: ${{ steps.service.outputs.url }}" >> "${GITHUB_STEP_SUMMARY}"
